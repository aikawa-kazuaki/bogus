<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高圧ガス 過去問クイズ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen flex flex-col justify-center items-center p-4 transition-colors duration-200">

    <div class="w-full max-w-xl bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 md:p-8 transition-colors duration-200 relative">
        
        <!-- 右上のコントロール（ダークモード切替） -->
        <div class="absolute top-6 right-6 flex items-center space-x-2">
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="ダークモード切替">
                <span id="dark-icon">🌙</span>
            </button>
        </div>

        <!-- タイトル -->
        <h1 class="text-2xl font-bold text-center text-slate-800 dark:text-white mb-2">高圧ガス 過去問クイズ</h1>
        
        <!-- 学習履歴サマリー -->
        <div id="stats-summary" class="text-xs text-center text-slate-500 dark:text-slate-400 mb-6">
            累計解答数: <span id="total-solved">0</span>問 / 正解率: <span id="accuracy-rate">0</span>%
        </div>

        <!-- ① 科目選択画面（トップ） -->
        <div id="start-screen" class="space-y-4 py-2">
            <p class="text-slate-600 dark:text-slate-300 text-center mb-4">学習する科目を選んでください。</p>
            
            <button onclick="startQuiz('gakushiki')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl text-lg transition shadow-md flex justify-between items-center">
                <span>学識</span>
                <span class="text-sm bg-blue-500 px-3 py-1 rounded-lg">5問挑戦 →</span>
            </button>

            <button onclick="startQuiz('hoan')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-xl text-lg transition shadow-md flex justify-between items-center">
                <span>保安管理技術</span>
                <span class="text-sm bg-emerald-500 px-3 py-1 rounded-lg">5問挑戦 →</span>
            </button>

            <button onclick="startQuiz('hohrei')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-6 rounded-xl text-lg transition shadow-md flex justify-between items-center">
                <span>法令</span>
                <span class="text-sm bg-amber-500 px-3 py-1 rounded-lg">5問挑戦 →</span>
            </button>

            <!-- ブックマーク・苦手克服ボタン -->
            <div class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                <button onclick="startBookmarkQuiz()" class="w-full bg-indigo-50 dark:bg-slate-700 hover:bg-indigo-100 dark:hover:bg-slate-600 text-indigo-700 dark:text-indigo-300 font-semibold py-3 px-4 rounded-xl text-sm transition border border-indigo-200 dark:border-slate-600 flex items-center justify-center space-x-2">
                    <span>📌 ブックマーク復習</span>
                </button>
                <button onclick="startWrongQuiz()" class="w-full bg-rose-50 dark:bg-slate-700 hover:bg-rose-100 dark:hover:bg-slate-600 text-rose-700 dark:text-rose-300 font-semibold py-3 px-4 rounded-xl text-sm transition border border-rose-200 dark:border-slate-600 flex items-center justify-center space-x-2">
                    <span>⚠️ 間違えた問題の克服</span>
                </button>
            </div>
        </div>

        <!-- ② クイズ画面（最初は隠す） -->
        <div id="quiz-container" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="question-count" class="text-sm font-semibold text-slate-500 dark:text-slate-400">問題 1 / 5</span>
                <div class="flex items-center space-x-2">
                    <span id="category-badge" class="bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs font-bold px-2.5 py-1 rounded">カテゴリ</span>
                    <button id="bookmark-btn" onclick="toggleBookmarkCurrent()" class="text-xl px-2 py-0.5 rounded border border-slate-200 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="ブックマーク">
                        ☆
                    </button>
                </div>
            </div>

            <!-- ★ 事業所の例を表示するコンテナを追加 -->
            <div id="facility-container" class="hidden mb-4 p-4 rounded-xl border-2 border-blue-200 bg-blue-50 dark:bg-slate-800 dark:border-blue-900 text-sm"></div>

            <!-- 問題文 -->
            <p id="question-text" class="text-slate-800 dark:text-slate-200 font-medium text-base mb-6 leading-relaxed whitespace-pre-wrap">問題文がここに入ります</p>

            <!-- 図表エリア -->
            <div id="diagram-container" class="hidden mb-6 p-4 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-center">
                <div id="diagram-content" class="text-sm text-slate-500 dark:text-slate-400">[図表エリア]</div>
            </div>

            <!-- ◯ × 選択肢エリア -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="answerQuestion(true)" id="btn-true" class="py-6 bg-blue-50 dark:bg-slate-700 hover:bg-blue-100 dark:hover:bg-slate-600 border-2 border-blue-200 dark:border-slate-600 rounded-2xl text-3xl font-extrabold text-blue-600 dark:text-blue-400 transition shadow-sm flex flex-col items-center justify-center space-y-1">
                    <span>◯</span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">正しい</span>
                </button>
                <button onclick="answerQuestion(false)" id="btn-false" class="py-6 bg-rose-50 dark:bg-slate-700 hover:bg-rose-100 dark:hover:bg-rose-600 border-2 border-rose-200 dark:border-slate-600 rounded-2xl text-3xl font-extrabold text-rose-600 dark:text-rose-400 transition shadow-sm flex flex-col items-center justify-center space-y-1">
                    <span>✕</span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">誤り</span>
                </button>
            </div>

            <!-- 解説エリア -->
            <div id="explanation-container" class="hidden mt-6 p-4 bg-slate-50 dark:bg-slate-700 border-l-4 border-blue-500 rounded-r-lg">
                <h3 class="font-bold text-slate-800 dark:text-white mb-1">【解説】</h3>
                <p id="explanation-text" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed"></p>
                <button onclick="nextQuestion()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow">
                    次の問題へ進む →
                </button>
            </div>

            <!-- クイズ中断ボタン -->
            <div class="mt-8 pt-4 border-t border-slate-200 dark:border-slate-700">
                <button onclick="backToStart()" class="w-full bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-bold py-3 px-4 rounded-lg transition">
                    クイズを中断して科目選択に戻る
                </button>
            </div>
        </div>

        <!-- ③ 結果画面（最初は隠す） -->
        <div id="result-container" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-4">お疲れ様でした！</h2>
            <p class="text-slate-600 dark:text-slate-300 mb-2">あなたの正解数は...</p>
            <p id="score-display" class="text-4xl font-extrabold text-blue-600 dark:text-blue-400 mb-8">0 / 5</p>
            <button onclick="backToStart()" class="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-xl transition shadow">
                科目選択に戻る
            </button>
        </div>

    </div>

    <!-- データファイルの読み込み（app.jsより前に記述） -->
    <script src="./data/facilityData.js"></script>
    <script src="./data/gakushiki.js"></script>
    <script src="./data/hoan.js"></script>
    <script src="./data/hohrei.js"></script>
    
    <!-- メインロジック -->
    <script src="./assets/js/app.js"></script>
</body>
</html>
